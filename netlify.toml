# Static Vite SPA — publish dist only (no serverless functions)

[build]
  command = "npm run build"
  publish = "dist"

[build.environment]
  NODE_VERSION = "22"

# SPA fallback for deep links / refresh (app is client-routed tabs today)
[[redirects]]
  from = "/*"
  to = "/index.html"
  status = 200
