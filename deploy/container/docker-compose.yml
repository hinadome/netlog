services:
  app:
    build:
      context: ../..
      dockerfile: deploy/container/Dockerfile
    image: netlog-lens:local
    restart: unless-stopped
    expose:
      - "8080"
    networks:
      - internal

  gateway:
    image: nginx:1.27-alpine
    restart: unless-stopped
    depends_on:
      - app
    ports:
      - "${HTTP_PORT:-80}:80"
      - "${HTTPS_PORT:-443}:443"
    volumes:
      - ./nginx/active.conf:/etc/nginx/conf.d/default.conf:ro
      - ./certs:/etc/nginx/ssl:ro
      - certbot_www:/var/www/certbot:ro
    networks:
      - internal
      - public

networks:
  internal:
  public:

volumes:
  certbot_www:
